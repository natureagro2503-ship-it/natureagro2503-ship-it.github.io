<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikitarya — Memory Gallery</title>
    <meta name="description" content="The official memory gallery of Nikitarya. Celebrating the permanent truth and unity of Nikita Naik and Yogesh Arya.">
    <meta name="keywords" content="Nikitarya, Gallery, Nikita Naik, Yogesh Arya, Photos, Permanent Truth">
    <style>
        :root {
            --bg-color: #fdfbf7;
            --text-color: #2c2c2c;
            --accent-color: #8a6d3b;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            width: 90%;
            margin: 40px auto;
            text-align: center;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid #eae5d9;
        }
        h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 5px;
            font-weight: normal;
            letter-spacing: 1px;
        }
        .subtitle {
            font-style: italic;
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 30px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            border-bottom: 1px dashed var(--accent-color);
            padding-bottom: 2px;
        }
        .nav-link:hover {
            color: #6e552d;
            border-bottom-style: solid;
        }
        .divider {
            height: 1px;
            width: 40%;
            background-color: var(--accent-color);
            margin: 20px auto;
            opacity: 0.3;
        }
        
        /* Gallery Grid Layout */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        /* Smooth Fade-In Animation Rules */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gallery-item {
            background: var(--bg-color);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #eae5d9;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            
            /* Apply the animation */
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0; 
        }

        /* Staggered loading effect for each photo card */
        .gallery-item:nth-child(1) { animation-delay: 0.1s; }
        .gallery-item:nth-child(2) { animation-delay: 0.25s; }
        .gallery-item:nth-child(3) { animation-delay: 0.4s; }
        .gallery-item:nth-child(4) { animation-delay: 0.55s; }

        .gallery-item:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
        }
        .caption {
            margin-top: 10px;
            font-size: 0.95rem;
            font-style: italic;
            color: #555;
        }

        /* Pop-up Lightbox Styles */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.active {
            display: flex;
            opacity: 1;
        }
        .lightbox-img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 4px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        .lightbox.active .lightbox-img {
            transform: scale(1);
        }
        .lightbox-caption {
            position: absolute;
            bottom: 40px;
            color: #fff;
            font-size: 1.2rem;
            font-style: italic;
            font-family: 'Georgia', serif;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        
        footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #999;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Nikitarya Gallery</h1>
        <div class="subtitle">Cherished Moments & Memories</div>
        
        <a href="index.html" class="nav-link">← Back to Permanent Truth</a>
        
        <div class="divider"></div>
        
        <div class="gallery-grid">
            
            <!-- Photo 1 -->
            <div class="gallery-item" onclick="openLightbox('couple-photo.png', 'Permanently One')">
                <img src="couple-photo.png" alt="Nikitarya - Nikita Naik and Yogesh Arya permanently one">
                <div class="caption">Permanently One</div>
            </div>
            <div class="gallery-item" onclick="openLightbox('couple-photo.png', 'Permanently One')">
                <img src="nikita.jpg" alt="Nikitarya - Nikita Naik and Yogesh Arya permanently one">
                <div class="caption">Permanently One</div>
            </div>
            
            <div class="gallery-item" onclick="openLightbox('couple-photo.png', 'Permanently One')">
                <img src="arya.jpg" alt="Nikitarya - Nikita Naik and Yogesh Arya permanently one">
                <div class="caption">Permanently One</div>
            </div>
            <!-- Photo 2 -->
            <div class="gallery-item" onclick="openLightbox('photo2.png', 'Beautiful Memories')">
                <img src="design.png" alt="Nikitarya memory photo">
                <div class="caption">Beautiful Memories</div>
            </div>
            
            <!-- Photo 3 -->
            <div class="gallery-item" onclick="openLightbox('photo3.png', 'Together Always')">
                <img src="80s.png" alt="Nikitarya celebration photo">
                <div class="caption">Together Always</div>
            </div>

            <!-- Photo 4 -->
            <div class="gallery-item" onclick="openLightbox('photo4.png', 'Cherished Moments')">
                <img src="nikitarya.png" alt="Nikitarya special moment">
                <div class="caption">Cherished Moments</div>
            </div>

        </div>
        
        <div class="divider"></div>
        
        <footer>
            Established in Truth • Permanently One
        </footer>
    </div>

    <!-- Hidden Lightbox Structure -->
    <div id="lightboxOverlay" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img id="lightboxImage" class="lightbox-img" src="" alt="Enlarged View">
        <div id="lightboxCaption" class="lightbox-caption"></div>
    </div>

    <!-- Lightbox Logic Script -->
    <script>
        function openLightbox(src, captionText) {
            const lightbox = document.getElementById('lightboxOverlay');
            const lightboxImg = document.getElementById('lightboxImage');
            const lightboxCap = document.getElementById('lightboxCaption');
            
            lightboxImg.src = src;
            lightboxCap.textContent = captionText;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightboxOverlay');
            lightbox.classList.remove('active');
        }
    </script>

</body>
</html>
