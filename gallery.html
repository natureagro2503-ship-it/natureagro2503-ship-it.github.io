<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikitarya — Memory Vault</title>
    <meta name="description" content="The official technical memory vault of Nikitarya.">
    <meta name="keywords" content="Nikitarya, Gallery, Tech Vault, CAD Blueprint">
    <style>
        :root {
            --bg-dark: #070f1e;
            --accent-cyan: #00ffcc;
            --accent-blue: #1e5598;
            --text-light: #e2f1ff;
            --panel-bg: rgba(11, 29, 58, 0.85);
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(30, 85, 152, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 85, 152, 0.15) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-light);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            width: 90%;
            margin: 40px auto;
            background: var(--panel-bg);
            padding: 40px 30px;
            border-radius: 4px;
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            color: var(--accent-cyan);
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .sys-status {
            font-size: 0.8rem;
            color: #8bb4e6;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 30px;
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px dashed var(--accent-cyan);
            padding-bottom: 2px;
        }
        .nav-link:hover {
            color: #fff;
            border-bottom-style: solid;
        }
        .divider {
            height: 1px;
            width: 40%;
            background-color: var(--accent-cyan);
            margin: 20px auto;
            opacity: 0.3;
        }
        
        /* Gallery Grid Layout */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        /* Smooth Fade-In Animation Rules */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gallery-item {
            background: rgba(7, 15, 30, 0.6);
            padding: 12px;
            border-radius: 2px;
            border: 1px solid rgba(30, 85, 152, 0.5);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0; 
            position: relative;
        }

        .gallery-item:nth-child(1) { animation-delay: 0.1s; }
        .gallery-item:nth-child(2) { animation-delay: 0.25s; }
        .gallery-item:nth-child(3) { animation-delay: 0.4s; }
        .gallery-item:nth-child(4) { animation-delay: 0.55s; }

        .gallery-item:hover {
            transform: scale(1.02);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            filter: grayscale(20%) contrast(105%);
        }
        .caption {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #b0cceb;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Pop-up Lightbox Styles */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(4, 9, 18, 0.95);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.active {
            display: flex;
            opacity: 1;
        }
        .lightbox-img {
            max-width: 90%;
            max-height: 80%;
            border: 1px solid var(--accent-cyan);
            padding: 5px;
            background: var(--bg-dark);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        .lightbox.active .lightbox-img {
            transform: scale(1);
        }
        .lightbox-caption {
            position: absolute;
            bottom: 40px;
            color: var(--accent-cyan);
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: var(--accent-cyan);
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .lightbox-close:hover {
            color: #fff;
        }
        
        footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #567bb0;
            border-top: 1px solid rgba(30, 85, 152, 0.3);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Nikitarya Vault</h1>
        <div class="sys-status">SECURE DATA NODE // VISUAL REGISTER ACTIVE</div>
        
        <a href="index.html" class="nav-link">← Return to Main Matrix</a>
        
        <div class="divider"></div>
        
        <div class="gallery-grid">
            
            <!-- Photo 1 -->
            <div class="gallery-item" onclick="openLightbox('couple-photo.png', '[RECORD_01] // PERMANENTLY ONE')">
                <img src="couple-photo.png" alt="Nikitarya core system layout">
                <div class="caption">PERMANENTLY ONE</div>
            </div>
            
            <!-- Photo 2 -->
            <div class="gallery-item" onclick="openLightbox('photo2.png', '[RECORD_02] // SYSTEM ALIGNMENT')">
                <img src="nikita.jpg" alt="Nikitarya alignment matrix">
                <div class="caption">SYSTEM ALIGNMENT</div>
            </div>
            
            <!-- Photo 3 -->
            <div class="gallery-item" onclick="openLightbox('photo3.png', '[RECORD_03] // KINETIC VECTOR')">
                <img src="arya.jpg" alt="Nikitarya kinetic vectors">
                <div class="caption">KINETIC VECTOR</div>
            </div>

            <!-- Photo 4 -->
            <div class="gallery-item" onclick="openLightbox('photo4.png', '[RECORD_04] // STRUCTURAL INTEGRITY')">
                <img src="design.png" alt="Nikitarya structural integration">
                <div class="caption">Orthographic</div>
            </div>
            <div class="gallery-item" onclick="openLightbox('photo4.png', '[RECORD_04] // STRUCTURAL INTEGRITY')">
                <img src="80s.png" alt="Nikitarya structural integration">
                <div class="caption">In 80s</div>
            </div>
            <div class="gallery-item" onclick="openLightbox('photo4.png', '[RECORD_04] // STRUCTURAL INTEGRITY')">
                <img src="nikitarya.png" alt="Nikitarya structural integration">
                <div class="caption">love</div>
            </div>
            <div class="gallery-item" onclick="openLightbox('photo4.png', '[RECORD_04] // STRUCTURAL INTEGRITY')">
                <img src="northeasttribal.png" alt="Nikitarya structural integration">
                <div class="caption">northeast</div>
            </div>
            <div class="gallery-item" onclick="openLightbox('photo4.png', '[RECORD_04] // STRUCTURAL INTEGRITY')">
                <img src="structural.png" alt="Nikitarya structural integration">
                <div class="caption">Engineer</div>
            </div>

        </div>
        
        <div class="divider"></div>
        
        <footer>
            NIKITAR_SYS GALLERY BLOCK // DATA STREAM LOCK COMPLETED
        </footer>
    </div>

    <!-- Hidden Lightbox Structure -->
    <div id="lightboxOverlay" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img id="lightboxImage" class="lightbox-img" src="" alt="Enlarged Architectural Record">
        <div id="lightboxCaption" class="lightbox-caption"></div>
    </div>

    <!-- 🎵 Floating Music Player Widget (Styled for Dark Engineering Theme) -->
    <div id="musicPlayer" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; background: var(--panel-bg); border: 1px solid var(--accent-cyan); padding: 10px 20px; border-radius: 2px; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); display: flex; align-items: center; gap: 10px; font-family: 'Courier New', monospace; cursor: pointer; transition: transform 0.2s ease;" onclick="toggleMusic()">
        <span id="musicIcon" style="font-size: 1.1rem; color: var(--accent-cyan);">🔊</span>
        <span id="musicStatus" style="font-size: 0.8rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px;">AUDIO: OFF</span>
        <audio id="bgAudio" src="music.mp3" loop></audio>
    </div>

    <!-- Scripts Logic -->
    <script>
        function openLightbox(imgSrc, captionText) {
            var overlay = document.getElementById('lightboxOverlay');
            var img = document.getElementById('lightboxImage');
            var cap = document.getElementById('lightboxCaption');
            
            img.src = imgSrc;
            cap.textContent = captionText;
            overlay.classList.add('active');
        }

        function closeLightbox() {
            var overlay = document.getElementById('lightboxOverlay');
            overlay.classList.remove('active');
        }

        function toggleMusic() {
            var audio = document.getElementById('bgAudio');
            var statusText = document.getElementById('musicStatus');
            var icon = document.getElementById('musicIcon');
            var playerCard = document.getElementById('musicPlayer');

            if (audio.paused) {
                audio.play()
                    .then(function() {
                        statusText.textContent = "AUDIO: ACTIVE";
                        icon.textContent = "⏹️";
                        
                           } else {
                audio.pause();
                statusText.textContent = "AUDIO: OFF";
                icon.textContent = "🔊";
                playerCard.style.transform = "scale(1)";
                playerCard.style.borderColor = "var(--accent-cyan)";
            }
        }
    </script> <!-- Closes the music script block -->

</body> <!-- Closes the webpage content zone -->
</html> <!-- Marks the absolute end of the document -->
